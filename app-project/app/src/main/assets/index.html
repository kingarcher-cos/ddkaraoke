<style>
  body { padding-bottom: 4.5rem; }
  .km-row { display:flex; align-items:center; gap:.6rem; padding:.5rem .6rem; margin:.4rem 0; }
  .km-row .km-t { flex:1; min-width:0; overflow-wrap:anywhere; }
  .km-row .button { min-width:48px; min-height:48px; flex:none; }
  .km-heart.is-on { color:#ff5a7a; }
  .km-actions { display:flex; gap:.5rem; flex:none; }
  nav.navbar:not(.km-bottom) { position:sticky; top:0; z-index:40; }
  nav.km-bottom { position:fixed; left:0; right:0; bottom:0; z-index:30; min-height:3.25rem; }
  nav.km-bottom .navbar-brand { width:100%; justify-content:space-around; min-height:3.25rem; }
  nav.km-bottom .navbar-item { flex-direction:column; gap:2px; font-size:.72rem; padding:.35rem .5rem; cursor:pointer; }
  nav.km-bottom .navbar-item i, nav.km-bottom .navbar-item svg { font-size:1.25rem; width:1.25rem; height:1.25rem; margin:0 !important; }
  nav.km-bottom .navbar-item i::before { margin:0 !important; }
  nav.km-bottom .navbar-item.is-active { color: hsl(141, 53%, 53%) !important; background: transparent; }
  @media (max-width: 1087px) { .navbar:not(.km-bottom) .navbar-brand > .navbar-item > span { display:none; } }
  #toast { position:fixed; left:50%; bottom:5rem; transform:translateX(-50%); background:#000c; color:#fff; padding:.7rem 1.1rem; border-radius:1.2rem; display:none; z-index:50; max-width:90vw; text-align:center; }
  .km-foot { text-align:center; font-size:.85rem; opacity:.8; padding:1rem; }
  #ribbon { display:none; align-items:center; gap:.5rem; margin:.4rem 10px; padding:.25rem .8rem; border-radius:1rem; background:#0006; width:fit-content; font-size:.85rem; }
  #ribbon i { width:.6rem; height:.6rem; border-radius:50%; background:#c3b94b; display:inline-block; }
  .table-wrap { overflow-x:auto; }
  table.km-table { table-layout:fixed; width:100%; }
  table.km-table td, table.km-table th { vertical-align:middle; padding:.4em .35em; font-size:.85rem; overflow-wrap:anywhere; word-break:break-word; }
  .km-res { display:flex; gap:.7rem; margin:.7rem 0; padding:.6rem; align-items:flex-start; flex-wrap:wrap; }
  .km-thumb { position:relative; width:160px; max-width:100%; aspect-ratio:16/9; background:#111; border-radius:6px; overflow:hidden; flex:none; cursor:pointer; }
  .km-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .km-thumb .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2rem; color:#fff; text-shadow:0 0 6px #000; opacity:.85; }
  .km-thumb .dur { position:absolute; right:4px; bottom:4px; background:#000b; color:#fff; font-size:.7rem; padding:1px 5px; border-radius:3px; }
  .km-info { flex:1; min-width:180px; overflow-wrap:anywhere; }
  .km-btns { display:flex; flex-direction:column; gap:.4rem; min-width:9.5rem; }
  .km-favbtn { min-width:46px; padding-left:.4em; padding-right:.4em; }
  @media (max-width: 640px) {
    .km-res { flex-direction:column; flex-wrap:nowrap; gap:.5rem; }
    .km-thumb { width:100%; max-width:340px; }
    .km-info { min-width:0; width:100%; }
    .km-btns { flex-direction:row; width:100%; min-width:0; gap:.4rem; }
    .km-btns .button { flex:1 1 0; min-width:0; white-space:nowrap; padding-left:.35em; padding-right:.35em; font-size:clamp(.7rem, 3.5vw, .95rem); }
    .km-btns .km-favbtn { flex:0 0 46px; font-size:1.2rem; }
  }
  .km-modal { position:fixed; inset:0; z-index:90; background:#000d; display:none; align-items:center; justify-content:center; padding:12px; }
  .km-modal .in { width:100%; max-width:720px; position:relative; }
  .km-modal video, .km-modal iframe { width:100%; aspect-ratio:16/9; background:#000; border:0; }
  .km-modal .x { position:absolute; right:0; top:-2.4rem; }
  .km-song { padding:.75rem .8rem; margin:.55rem 0; }
  .navbar:not(.km-bottom) .navbar-brand > .navbar-item > svg { width:1.25rem; height:1.25rem; margin-right:.5rem; }
  .km-menurow { display:flex; gap:.5rem; }
  .navbar-item.km-menurow, .navbar-item.km-menurow:hover { background:transparent !important; }
  .km-pill { flex:1; text-align:center; padding:.5rem .6rem; border-radius:8px; background:rgba(255,255,255,.08); color:inherit; cursor:pointer; white-space:nowrap; }
  .km-loader { display:flex; align-items:center; justify-content:center; gap:.7rem; padding:1rem 0; }
  .km-loader img { width:3.2rem; height:auto; animation:km-spin 2.4s linear infinite; }
  @keyframes km-spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .km-loader img { animation:none; } }
  .km-popup [data-tab="settings"] { display:none !important; }
  .km-credits { display:grid; grid-template-columns:max-content 1fr; gap:.2rem .9rem; opacity:.8; line-height:1.35; }
  .km-credits dt { font-weight:700; }
  .km-credits dd { margin:0; }
  .km-pill:hover, .km-pill.is-active { background:rgba(255,255,255,.16); color:inherit; }
  .km-note { font-size:.78rem; opacity:.7; margin:-.2rem 0 .8rem; }
  .km-title { font-weight:600; overflow-wrap:anywhere; margin-bottom:.55rem; }
  .km-arow { display:flex; gap:.5rem; align-items:stretch; }
  .km-arow .button { min-height:46px; }
  .km-arow .km-add { flex:1; min-width:0; }
  .km-arow .km-ic { width:46px; padding:0; flex:none; }
  .km-badge { position:absolute; left:4px; top:4px; background:#2d9d5c; color:#fff; font-size:.65rem; padding:1px 6px; border-radius:3px; font-weight:600; }
  .km-qrow { display:flex; align-items:center; gap:.5rem; padding:.5rem .6rem; margin:.4rem 0; }
  .km-handle { cursor:grab; touch-action:none; font-size:1.4rem; padding:0 .4rem; user-select:none; opacity:.8; flex:none; }
  .km-ghost { opacity:.4; }
  .km-scrub { width:100%; accent-color:#c3b94b; }
  body.tv .navbar, body.tv nav.km-bottom, body.tv .km-foot, body.tv #ribbon { display:none !important; }
  body.tv { padding-bottom: 1rem; font-size: 1.15rem; }
  body.tv *:focus { outline: 4px solid #fff !important; outline-offset: 3px; }
  .tv-row { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.7rem .9rem; margin:.35rem 0; border-radius:8px; background:#0003; }
  .tv-row .lbl { flex:1; }
  .tv-val { min-width:4.5rem; text-align:center; font-weight:700; }
  .tv-row .button { min-width:3.2rem; min-height:3rem; }
  .km-sheet .button { width:100%; justify-content:flex-start; margin-bottom:.5rem; min-height:48px; }
</style>
<script src="/static/sortable.min.js"></script>

<body>
<div class="container" style="padding:5px; max-width:900px;">
  <nav class="navbar" role="navigation" aria-label="main navigation">
    <div class="navbar-brand" style="padding-left:10px">
      <a class="navbar-item" data-tab="downloads"><i class="icon icon-down-circled" title="Downloads"></i><span>Downloads</span></a>
      <a class="navbar-item" data-tab="browse"><i class="icon icon-music" title="Songs"></i><span>Songs</span></a>
      <a class="navbar-item" data-tab="favs" title="Favourites"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>Favourites</span></a>
      <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" id="burger" tabindex="0"><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span></a>

          <a class="navbar-link" id="ddlink" tabindex="0"><i class="icon icon-info-circled-1" title="DDKaraoke"></i><span>DDKaraoke</span></a>

            <a class="navbar-item" data-tab="rankings"><i class="icon icon-th-list-outline"></i>&nbsp;<span>Rankings</span></a>

            <hr class="navbar-divider">

              <a class="km-pill" href="https://ko-fi.com/kingarcher" target="_blank" rel="noopener">&#9749; Ko-fi</a>
              <a class="km-pill" data-tab="settings"><i class="icon icon-cog"></i>&nbsp;Settings</a>
            </div>
            <div class="navbar-item km-menurow" id="foodrow" style="display:none">
              <a class="km-pill" id="foodlink" href="https://doughbaybee.sg/" target="_blank" rel="noopener">&#127829; Order party food</a>
            </div>
            <a class="navbar-item" data-tab="about"><i class="icon icon-info"></i>&nbsp;<span>Disclaimer</span></a>

  </nav>

  <div id="ribbon"><i></i><span></span></div>
  <div id="view"></div>

  <div class="km-foot">Enjoying the party? <a href="https://ko-fi.com/kingarcher" target="_blank" rel="noopener">Buy us a coffee &#9749;</a> Totally optional, thank you!</div>
</div>

<nav class="navbar km-bottom" role="navigation" aria-label="song extras">
  <div class="navbar-brand">
    <a class="navbar-item" data-tab="home" title="Home"><i class="icon icon-home-2"></i><span>Home</span></a>
    <a class="navbar-item" data-tab="search" title="Add New"><i class="icon icon-plus-circled"></i><span>Add New</span></a>
    <a class="navbar-item" data-tab="queue" title="Queue"><i class="icon icon-list-numbered"></i><span>Queue</span></a>
    <a class="navbar-item" data-tab="interact" title="Interact with the TV">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 6.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm5 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm5 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg><span>Interact</span>
    </a>
    <a class="navbar-item" data-tab="history" title="My history"><i class="icon icon-list-alt"></i><span>My history</span></a>
  </div>

<div id="toast"></div>
<div class="km-modal" id="modal"><div class="in"><button class="button is-small x" id="modalx">Close</button><div id="modalbody"></div><p class="notification is-danger is-light mt-2" id="modalerr" style="display:none">Preview unavailable for this song.</p></div></div>

<script>
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let tab = "home", songs = [], q = "";
let isAdmin = false, prefs = {};
const POPUP = new URLSearchParams(location.search).has("popup");   // menu panel on the TV: full phone page, no Settings entry
if (POPUP) document.documentElement.classList.add("km-popup");
const TV = location.hostname === "127.0.0.1" && !POPUP;
if (TV) document.body.classList.add("tv");
let favs = store.get("favs", []).map((f) => typeof f === "string" ? { file: f, title: f.replace(/\.[^.]+$/, ""), remote: null } : f);
let hist = store.get("hist", []), name = store.get("name", "");
function isFav(file) { return favs.some((f) => f.file === file); }
function remoteFromEntry(e) { return e.base === "youtube" ? { kind: "yt", id: e.kid, title: e.title, channel: "" } : { kind: "km", kid: e.kid, base: e.base }; }

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 3000); }
function msg(t) { return el("p", "has-text-centered", t); }
function fmtDur(s) { s = Math.round(s || 0); if (!s) return ""; return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function dev() { let d = store.get("dev", ""); if (!d) { d = Array.from(crypto.getRandomValues(new Uint32Array(4))).join("-"); store.set("dev", d); } return d; }
const NEEDS_NAME = /^\/api\/(cheer|overlay$|message)/;
async function post(url, obj) {
  if (!name && NEEDS_NAME.test(url)) { askName(); return { ok: false, error: "Please enter your name first." }; }
  return await (await fetch(url, { method: "POST", body: JSON.stringify(Object.assign({ user: name, dev: dev() }, obj)) })).json();
}

// queue button state
let queuedFiles = new Set(); const qBtns = [];
function queueBtn(file, cls) {
  const b = el("button", cls || "button is-primary km-add", "Add to queue");
  qBtns.push({ b, file }); applyQueued({ b, file }); return b;
}
function applyQueued(r) {
  const on = queuedFiles.has(r.file);
  r.b.textContent = on ? "Song queued" : "Add to queue"; r.b.disabled = on; r.b.classList.toggle("is-light", on);
}
function syncQueued() { for (let i = qBtns.length - 1; i >= 0; i--) { if (!qBtns[i].b.isConnected) qBtns.splice(i, 1); else applyQueued(qBtns[i]); } }
function markQueued(file) { queuedFiles.add(file); syncQueued(); }
async function pollQueued() {
  try { const j = await (await fetch("/api/queue", { cache: "no-store" })).json(); queuedFiles = new Set(j.queue.map((i) => i.file)); syncQueued(); } catch (e) {}
  setTimeout(pollQueued, 3000);
}
pollQueued();

// top bar
$("#burger").onclick = () => { $("#burger").classList.toggle("is-active"); $("#menu").classList.toggle("is-active"); };
$("#ddlink").onclick = () => { $("#dd").classList.toggle("is-active"); };
function showName() { const c = $("#current-user"); c.classList.toggle("is-hidden", !name); c.querySelector("span").textContent = name; }
async function refreshRibbon() {
  try {
    const j = await (await fetch("/api/queue")).json(); const r = $("#ribbon");
    if (prefs.showSessionName !== false && j.session && j.session.name) { r.style.display = "flex"; r.querySelector("span").textContent = j.session.name; } else r.style.display = "none";
  } catch (e) {}
}
function setTab(t) {
  refreshRibbon(); tab = t; lastSig = null;
  $("#menu").classList.remove("is-active"); $("#burger").classList.remove("is-active"); $("#dd").classList.remove("is-active");
  document.querySelectorAll("[data-tab]").forEach((a) => a.classList.toggle("is-active", a.dataset.tab === t));
  showName(); render();
}
document.querySelectorAll("[data-tab]").forEach((a) => {
  a.tabIndex = 0; a.onclick = () => setTab(a.dataset.tab);
  a.addEventListener("keydown", (e) => { if (e.key === "Enter") a.click(); });
});

// name prompt
function askName() {
  if (document.getElementById("nameGate")) return;
  const ov = el("div"); ov.id = "nameGate";
  ov.style.cssText = "position:fixed;inset:0;z-index:100;background:#000d;display:flex;align-items:center;justify-content:center;padding:16px";
  const box = el("div", "box"); box.style.cssText = "max-width:420px;width:100%";
  box.append(el("h1", "title is-4", "Welcome!"), el("p", "mb-3", "What should we call you? It shows next to the songs you pick. You can change it later in Settings."));
  const inp = el("input", "input mb-3"); inp.maxLength = 24; inp.placeholder = "Your name"; inp.autocomplete = "off";
  const b = el("button", "button is-primary is-fullwidth", "Submit"); const note = el("p", "is-size-7 has-text-warning mt-2");
  const go = () => {
    const v = inp.value.trim();
    if (!v) { note.textContent = "Please type a name."; return; }
    name = v; store.set("name", name); ov.remove(); showName(); render();
  };
  b.onclick = go; inp.addEventListener("keypress", (e) => { if (e.key === "Enter") go(); });
  box.append(inp, b, note); ov.append(box); document.body.append(ov); setTimeout(() => inp.focus(), 50);
}

// songs on the box
let libPage = 0, libQ = "";
async function loadSongs() { try { songs = (await (await fetch("/api/songs?q=" + encodeURIComponent(q))).json()).songs; } catch (e) { songs = []; } }
async function request(file, title) {
  if (!name) { askName(); return false; }
  const j = await (await fetch("/api/request", { method: "POST", body: new URLSearchParams({ singer: name, file }) })).json();
  if (j.ok) { hist = [{ file, title, ts: Date.now() }].concat(hist.filter((h) => h.file !== file)).slice(0, 100); store.set("hist", hist); }
  toast(j.ok ? "Added to the queue!" : (j.error || "Could not add that song."));
  return !!j.ok;
}
function toggleFavQuiet(x) {
  favs = isFav(x.file) ? favs.filter((f) => f.file !== x.file) : favs.concat({ file: x.file, title: x.title, remote: x.remote || null });
  store.set("favs", favs);
}
function toggleFav(x) { toggleFavQuiet(x); render(); }
async function keepSong(file, kept) { await post("/api/keep", { file, kept }); render(); }
async function deleteSong(file, title) {
  if (!confirm("Delete “" + title + "” from the box?")) return;
  const r = await post("/api/songs/delete", { file }); toast(r.ok ? "Deleted." : (r.error || "Could not delete.")); render();
}
function songRow(x, opts) {
  opts = opts || {};
  const d = el("div", "box km-song");
  d.append(el("div", "km-title", x.title));
  if (x.sung) d.append(el("div", "is-size-7 has-text-success mb-2", "Sung " + fmtTime(x.ts)));
  const row = el("div", "km-arow");
  const add = queueBtn(x.file);
  add.onclick = async () => {
    const ok = (x.remote && !x.local) ? await addRemote(x.remote, true, add, { file: x.file, title: x.title }) : await request(x.file, x.title);
    if (ok) markQueued(x.file);
  };
  row.append(add);
  if (x.cached) {
    const k = el("button", "button km-ic" + (x.kept ? " is-warning" : ""), x.kept ? "★" : "☆");
    k.title = x.kept ? "Kept: this song will not be removed" : "Keep this song so it is not removed after it plays";
    k.onclick = () => keepSong(x.file, !x.kept); row.append(k);
  }
  const h = el("button", "button km-ic km-heart" + (isFav(x.file) ? " is-on" : ""), isFav(x.file) ? "♥" : "♡");
  h.title = "Favourite"; h.setAttribute("aria-label", "Favourite"); h.onclick = () => toggleFav(x); row.append(h);
  if (opts.del && isAdmin) {
    const del = el("button", "button km-ic is-danger is-light", "✕"); del.title = "Delete from the box"; del.setAttribute("aria-label", "Delete");
    del.onclick = () => deleteSong(x.file, x.title); row.append(del);
  }
  d.append(row); return d;
}
function starNote() { return el("p", "km-note", "★ Keep: tap the star on a song to protect it, so it is never cleared to make room for new songs."); }
function songRowFor(file, title) { return songRow(songs.find((s) => s.file === file) || { file, title }, {}); }

// Home
let scrub = null, scrubDragging = false;
function fmtClock(sec) { sec = Math.max(0, Math.floor(sec || 0)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
async function updateScrub() {
  if (tab === "home" && scrub && scrub.rng.isConnected && !scrubDragging) {
    try {
      const st = await (await fetch("/api/player", { cache: "no-store" })).json();
      scrub.rng.max = Math.max(1, Math.floor(st.duration || 0)); scrub.rng.value = st.position || 0;
      scrub.cur.textContent = fmtClock(st.position); scrub.tot.textContent = fmtClock(st.duration);
    } catch (e) {}
  }
  setTimeout(updateScrub, 1000);
}
updateScrub();
async function homeControls(card) {
  const st = await (await fetch("/api/player")).json();
  const box = el("div", "mt-4");
  // scrubber
  const sc = el("div", "mb-3");
  const labs = el("div", "is-flex is-justify-content-space-between is-size-7"); const cur = el("span", "", fmtClock(st.position)); const tot = el("span", "", fmtClock(st.duration)); labs.append(cur, tot);
  const rng = el("input", "km-scrub"); rng.type = "range"; rng.min = 0; rng.max = Math.max(1, Math.floor(st.duration || 0)); rng.value = st.position || 0; rng.step = 1;
  rng.oninput = () => { scrubDragging = true; cur.textContent = fmtClock(rng.value); };
  rng.onchange = async () => { await post("/api/seek", { to: +rng.value }); setTimeout(() => { scrubDragging = false; }, 800); };
  sc.append(labs, rng); box.append(sc);
  scrub = { rng, cur, tot };
  const row1 = el("div", "buttons");
  const vocals = el("button", "button " + (st.vocals.on ? "is-dark" : "is-warning"), st.vocals.on ? "🎤 Vocals: ON" : "🎤 Vocals: OFF");
  vocals.onclick = async () => { await post("/api/vocals", { on: !st.vocals.on }); render(); };
  const skip = el("button", "button is-danger is-light", "⏭ Skip");
  skip.onclick = async () => { if (confirm("Skip this song?")) { await post("/api/skip", {}); setTimeout(render, 600); } };
  const skipScore = el("button", "button is-dark", "⏩ Skip score");
  skipScore.onclick = async () => { await post("/api/skipscore", {}); };
  const styleNow = (st.style && st.style.mode) || "classic";
  const style = el("button", "button is-dark", "Style: " + (styleNow === "classic" ? "Classic" : "Gentle"));
  style.title = "Classic is the home server's method. Gentle keeps the bass, drums and wide sounds."
;  style.onclick = async () => { await post("/api/vocalstyle", { mode: styleNow === "classic" ? "gentle" : "classic" }); render(); };

// Updates box, used on the phone and the TV settings. Talks to /api/update.
async function updateBox(card, tvStyle) {
  const status = el("p", "is-size-7 mb-2", "");
  const check = el("button", "button is-dark", "Check for updates");
  const go = el("button", "button is-primary", "Update now"); go.style.display = "none";
  if (tvStyle) for (const b of [check, go]) b.style.cssText += ";min-height:3.2rem;margin:.35rem 0;display:block;width:100%";
  go.style.display = "none";
  let timer = null;
  const show = (u) => {
    clearTimeout(timer);
    if (u.error) status.textContent = u.error;
    else if (u.busy === "downloading") status.textContent = "Downloading... " + u.percent + "%";
    else if (u.busy === "installing") status.textContent = "Almost there. Follow the install prompt on the TV.";
    else if (u.available) status.textContent = "Version " + u.latest.replace(/^v/, "") + " is available. You have " + u.current + ".";

    go.style.display = u.available && !u.busy ? (tvStyle ? "block" : "") : "none";

  };
  check.onclick = async () => { status.textContent = "Checking..."; check.disabled = true; show(await post("/api/update/check", {})); check.disabled = false; };
  go.onclick = async () => { await post("/api/update/install", {}); show({ busy: "downloading", percent: 0 }); };

  const nDelay = numRow(card, "The delay in seconds before playing the next song", P.nextDelay, 0, 60);
  card.append(el("p", "is-size-7 has-text-grey", "The splash logo is built in and cannot be changed in this app."));

  section(card, "Colours");
  const colF = el("div", "field mb-3"); colF.append(el("label", "label is-size-7", "Colour (buttons, bars and links)"));
  const col = el("input"); col.type = "color"; col.value = P.accent; colF.append(col); card.append(colF);
  const sHue = numRow(card, "Background colour (0-360)", P.bgHue, 0, 360);
  const sSat = numRow(card, "Strength (0-300)", P.bgSat, 0, 300);
  const sBri = numRow(card, "Brightness (0-200)", P.bgBright, 0, 200);
  const reset = el("button", "button is-dark is-small", "Reset colours");
  reset.onclick = () => { col.value = "#c3b94b"; sHue.value = 135; sSat.value = 135; sBri.value = 55; };
  card.append(reset);

  section(card, "Score phrases");
  const ta = (label, v) => { const w = el("div", "field mb-2"); w.append(el("label", "label is-size-7", label)); const t = el("textarea", "textarea"); t.rows = 5; t.value = v; w.append(t); card.append(w); return t; };
  const tLow = ta("LOW score phrases (score < 30), one per line", P.scoreLow);
  const tMid = ta("MID score phrases (30 to 59), one per line", P.scoreMid);
  const tHigh = ta("HIGH score phrases (60 and up), one per line", P.scoreHigh);

  section(card, "Queue");
  const cFair = checkRow(card, "Fair queue: singers take turns, so one person cannot fill the whole queue", P.fairQueue);
  const nLimit = numRow(card, "Limit of songs an individual can have in the queue (0 = no limit)", P.limitPerPerson, 0, 50);

  section(card, "Where songs are stored");
  card.append(el("p", "is-size-7 has-text-grey mb-2", st.songCount + " songs in the chosen place."));
  let chosen = st.folder;
  const box = el("div", "mb-2");
  st.options.forEach((o) => {
    const r = el("label", "box km-row"); const radio = el("input"); radio.type = "radio"; radio.name = "place"; radio.checked = o.path === st.folder;
    radio.onchange = () => { chosen = o.path; };
    const t = el("div", "km-t"); t.append(el("div", "", o.label + ": " + o.freeGb + " GB free of " + o.totalGb + " GB"), el("div", "is-size-7 has-text-grey-light", o.path));
    r.append(radio, t); box.append(r);
  });
  card.append(box);
  card.append(el("p", "is-size-7 has-text-warning mb-3", "Plugged in a drive just now? Close and reopen the app so it shows up here."));
  const gb = numRow(card, "Download space limit in GB (oldest songs are removed first)", st.cacheGb, 1, 500);
  const nPer = numRow(card, "Default songs per page on the Songs page", P.songsPerPage, 10, 200);

  section(card, "Sessions");
  card.append(el("p", "is-size-7 has-text-grey mb-2", "A session is one party. Rankings and Play History can be shown for one session or all of them. Giving it a name shows the name on every phone."));
  const sn = el("input", "input mb-2"); sn.maxLength = 30; sn.placeholder = "Session name (optional)"; card.append(sn);
  const sq2 = el("label", "checkbox is-size-7 mb-2"); const sqb = el("input"); sqb.type = "checkbox"; sq2.append(sqb, document.createTextNode(" Also clear the queue")); card.append(sq2);
  const sbtn = el("button", "button is-dark is-small mt-2", "Start a new session"); const snote = el("p", "is-size-7 has-text-grey mt-1");
  sbtn.onclick = async () => {
    if (!confirm("Start a new session?")) return;
    const r = await post("/api/session/new", { name: sn.value, clearQueue: sqb.checked });
    snote.textContent = r.ok ? "New session started." : (r.error || "Could not start one."); if (r.ok) { sn.value = ""; refreshRibbon(); }
  };
  card.append(sbtn, snote);

  section(card, "Community Databases");
  card.append(el("p", "is-size-7 has-text-grey mb-2", "Addresses of song databases to search on the Add New page. A song downloads only when it is next in the queue, and goes away after it plays unless you keep it. Only add sources you are allowed to use. What you download is your responsibility."));
  const srcBox = el("div", "mb-2"); card.append(srcBox);
  const srcRows = [];
  function addSrcRow(url, nm) {
    const row = el("div", "field has-addons mb-2");
    const c0 = el("div", "control"); const ni2 = el("input", "input"); ni2.placeholder = "Name"; ni2.maxLength = 30; ni2.value = nm || ""; ni2.style.width = "7em"; c0.append(ni2);
    const c1 = el("div", "control is-expanded"); const ui = el("input", "input"); ui.placeholder = "https://..."; ui.value = url || ""; c1.append(ui);
    const c2 = el("div", "control"); const rm = el("button", "button is-danger is-light", "✕"); c2.append(rm);
    row.append(c0, c1, c2); srcBox.append(row);
    const ref = { ni: ni2, ui }; srcRows.push(ref);
    rm.onclick = () => { row.remove(); srcRows.splice(srcRows.indexOf(ref), 1); };
  }
  (st.sources || []).forEach((x) => addSrcRow(x.url, x.name));
  const addSrc = el("button", "button is-dark is-small", "+ Add a source"); addSrc.onclick = () => addSrcRow("", "");
  card.append(addSrc);

  section(card, "System info");
  card.append(el("p", "is-size-7 mb-1", "App version: " + (st.version || "")));
  card.append(el("p", "is-size-7 mb-1", "Songs on the box: " + st.songCount));
  const cur = st.options.find((o) => o.path === st.folder);
  if (cur) card.append(el("p", "is-size-7 mb-1", "Free space where songs are stored: " + cur.freeGb + " GB of " + cur.totalGb + " GB"));

  section(card, "Keep the same address");
  card.append(el("p", "is-size-7 mb-2", "Your router gives each device an address, and now and then it gives the TV box a new one, usually after a restart. When that happens, phones that were open stop working until they scan the code again, and they forget their name, favourites and history."));
  card.append(el("p", "is-size-7 mb-2", "To stop it, tell your router to always give this box the same address. In the router's settings, look for DHCP reservation, address reservation or static lease (often under LAN or Network). Pick this box from the list of devices and save."));
  card.append(el("p", "is-size-7 has-text-grey mb-3", "This box's address is the one printed under the QR code on the TV" + (location.hostname !== "127.0.0.1" ? " (right now: " + location.hostname + ")." : ".")));

  const save = el("button", "button is-primary mt-4", "Save settings"); const note = el("p", "is-size-7 has-text-grey mt-2");
  save.onclick = async () => {
    note.className = "is-size-7 has-text-grey mt-2"; note.textContent = "Saving...";
    const body = { folder: chosen, cacheGb: parseInt(gb.value, 10) || 2 };
    if (np.value) body.newPin = np.value;
    const srcNow = srcRows.map((r) => ({ url: r.ui.value.trim(), name: r.ni.value.trim() })).filter((x) => x.url);
    if (JSON.stringify(srcNow) !== JSON.stringify((st.sources || []).map((x) => ({ url: x.url, name: x.name })))) body.sources = srcNow;
    const r1 = await (await fetch("/api/settings", { method: "POST", body: JSON.stringify(body) })).json();
    if (!r1.ok) { note.className = "is-size-7 has-text-warning mt-2"; note.textContent = r1.error; return; }
    const r2 = await (await fetch("/api/prefs", { method: "POST", body: JSON.stringify({
      disableBgVideo: cBgV.checked, disableBgMusic: cBgM.checked, scoreEnabled: cScore.checked, showClock: cClock.checked, hideQr: cQr.checked,
      showSessionName: cSess.checked, showQueueNotices: cNotice.checked, showPromo: cPromo.checked, deleteAfterPlay: cDel.checked, videoVolume: +nVol.value, bgMusicVolume: +nMus.value, nextDelay: +nDelay.value,
      accent: col.value, bgHue: +sHue.value, bgSat: +sSat.value, bgBright: +sBri.value,
      scoreLow: tLow.value, scoreMid: tMid.value, scoreHigh: tHigh.value,
      fairQueue: cFair.checked, limitPerPerson: +nLimit.value, songsPerPage: +nPer.value,
    }) })).json();
    if (!r2.ok) { note.className = "is-size-7 has-text-warning mt-2"; note.textContent = r2.error; return; }
    np.value = ""; note.textContent = "Saved."; loadSongs();
  };
  card.append(save, note);

  section(card, "Updates");
  const cAuto = checkRow(card, "Look for new versions by itself", P.autoUpdate);
  cAuto.onchange = () => fetch("/api/prefs", { method: "POST", body: JSON.stringify({ autoUpdate: cAuto.checked }) });
  await updateBox(card, false);
  section(card, "Quit");
  const quit = el("button", "button is-danger is-light", "Quit DDKaraoke");
  quit.onclick = async () => { if (confirm("Close the app on the TV? Phones will stop working until it is opened again.")) await post("/api/quit", {}); };
  card.append(quit);
}

function renderAbout(card) {
  card.append(el("h1", "title", "Disclaimer"));
  card.append(el("p", "mb-3", "This app was built from PiKaraoke and has been manually and heavily customised."));
  card.append(el("p", "mb-3", "As an important disclaimer, Claude, an AI assistant, was mainly used to assist porting the app to Android TV and add features such as Interact, the vocal toggle, and the settings screens."));
  card.append(el("p", "mb-3", "No generative AI images are used in the app's own artwork. We refuse to use any. The button icons come from open icon sets, Fontello and Material Design. Thumbnails in search results come from the sources themselves."));
  card.append(el("h2", "title is-5 mt-4 mb-1", "Usage note"));
  card.append(el("p", "mb-3", "This app does not come with any karaoke songs or videos. Content comes from third-party sources the host chooses, such as YouTube or song databases. All content rights remain with their respective owners. The host is responsible for the sources they choose and how the content is used, including following each source's terms and applicable copyright laws. Anything downloaded stays on the host's own device."));
  card.append(el("p", "mb-3", "The app is provided as is. Content availability and functionality may change."));
  addCredits(card);
}

// page rendering
async function render() {
  const v = $("#view"); v.textContent = "";
  if (location.hostname === "127.0.0.1") v.append(el("p", "has-text-warning is-size-7 mb-2", "On the TV: press BACK on the remote to close this screen."));
  const card = el("div", "box"); v.append(card);
  if (tab === "home") {
    const j = await (await fetch("/api/queue")).json();
    card.append(el("h1", "title", "Now Playing"));
    card.append(el("p", "subtitle has-text-warning", j.now ? j.now : "Nothing is playing right now."));
    card.append(el("h2", "title is-5", "Next Song"));
    card.append(el("p", "has-text-warning", j.queue.length ? j.queue[0].singer + ": " + j.queue[0].title : "No song is queued."));
    if (j.now) await homeControls(card);
  } else if (tab === "browse") await renderBrowse(card);
  else if (tab === "downloads") await renderDownloads(card);
  else if (tab === "search") await renderSearch(card);
  else if (tab === "favs") {
    card.append(el("h1", "title", "Favourites"));
    card.append(starNote());
    await loadSongs();
    if (!favs.length) card.append(msg("No favourites yet. Tap the heart on a song."));
    favs.forEach((f) => {
      const here = songs.find((s2) => s2.file === f.file);
      card.append(songRow(Object.assign({}, here || {}, f, { title: (here && here.title) || f.title, local: !!here }), {}));
    });
  } else if (tab === "history") {
    card.append(el("h1", "title", "My history"));
    card.append(starNote());
    await loadSongs();
    let sung = [];
    try { sung = (await (await fetch("/api/history?session=all")).json()).entries.filter((e) => name && e.singer.toLowerCase() === name.toLowerCase() && e.status === "played"); } catch (e) {}
    const map = new Map();
    hist.forEach((h) => map.set(h.file, { file: h.file, title: h.title, ts: h.ts, remote: h.remote, sung: false }));
    sung.forEach((e) => {
      const cur = map.get(e.file);
      if (cur) { cur.sung = true; cur.ts = Math.max(cur.ts, e.at); }
      else map.set(e.file, { file: e.file, title: e.title, ts: e.at, remote: e.kid && e.base ? remoteFromEntry(e) : null, sung: true });
    });
    const list = [...map.values()].sort((a, b) => b.ts - a.ts);
    if (!list.length) card.append(msg("Songs you request or sing will show up here."));
    list.forEach((x) => {
      const here = songs.find((s2) => s2.file === x.file);
      card.append(songRow(Object.assign({}, here || {}, x, { local: !!here }), {}));
    });
  } else if (tab === "interact") await renderInteract(card);
  else if (tab === "settings") await renderSettings(card);
  else if (tab === "about") renderAbout(card);
  else if (tab === "rankings") await renderRankings(card);
  else if (tab === "playlog") await renderPlayLog(card);
  else if (tab === "queue") {
    const j = await (await fetch("/api/queue")).json();
    card.append(el("h1", "title", "Queue"));
    if (j.now) card.append(el("p", "has-text-warning", "▶ Now singing: " + j.now));
    if (!j.queue.length) card.append(msg("Nothing queued yet. Pick a song!"));
    else card.append(el("p", "is-size-7 has-text-grey mb-2", "Drag ☰ to move a song, or tap ⋯ for more."));
    const list = el("div"); card.append(list);
    j.queue.forEach((it, i) => {
      const d = el("div", "box km-qrow"); d.dataset.id = it.id;
      const h = el("div", "km-handle", "☰"); h.title = "Drag to move";
      const t = el("div", "km-t");
      t.append(el("div", "", (i + 1) + ". " + it.title), el("div", "is-size-7 has-text-grey-light", "\uD83C\uDFA4 " + it.singer + (it.state === "downloading" ? " · Downloading " + it.percent + "%" : it.state === "waiting" ? " · Waiting to download" : it.state === "error" ? " · Download problem" : "")));
      const more = el("button", "button km-ic", "⋯"); more.title = "More"; more.style.cssText = "min-width:46px;min-height:46px;flex:none";
      more.onclick = () => queueMenu(it, i, j.queue.length);
      d.append(h, t, more); list.append(d);
    });
    if (window.Sortable && j.queue.length > 1) {
      Sortable.create(list, {
        handle: ".km-handle", animation: 150, ghostClass: "km-ghost", forceFallback: false,
        onStart: () => { qBusy = true; },
        onEnd: async (e) => { if (e.newIndex !== e.oldIndex) await post("/api/queue/move", { id: +e.item.dataset.id, to: e.newIndex }); qBusy = false; render(); },
      });
    }
  }
}
setInterval(() => { if (isAdmin && !TV) fetch("/api/admin").catch(() => {}); }, 60000);
let lastSig = null;
async function refreshIfChanged() {
  if (qBusy || scrubDragging || $("#modal").style.display === "flex" || document.getElementById("nameGate")) return;
  let sig = null;
  try {
    if (tab === "home") {
      const [q, p] = await Promise.all([fetch("/api/queue"), fetch("/api/player")]).then((rs) => Promise.all(rs.map((r) => r.json())));
      sig = JSON.stringify([q.now, q.queue.map((i) => i.id), p.vocals.on, p.key.semitones, p.mono, !!p.file]);
    } else if (tab === "queue") {
      const q = await (await fetch("/api/queue")).json();
      sig = JSON.stringify([q.now, q.queue.map((i) => [i.id, i.state, Math.floor(i.percent / 10)])]);
    } else if (tab === "downloads") {
      const d = await (await fetch("/api/downloads")).json();
      sig = JSON.stringify(d.items.map((i) => [i.file, i.state, Math.floor(i.percent / 10)]));
    }
  } catch (e) { return; }
  if (sig === null) return;
  if (lastSig === null) { lastSig = sig; return; }
  if (sig !== lastSig) { lastSig = sig; const y = window.scrollY; await render(); window.scrollTo(0, y); }
}
setInterval(refreshIfChanged, 4000);
(async () => {
  try {
    const pr = await (await fetch("/api/promo")).json();
    if (pr.show) { const d = $("#promo"); const a = el("a", "", pr.text); a.href = pr.url; a.target = "_blank"; a.rel = "noopener"; d.append(a); d.style.display = "block"; $("#foodrow").style.display = ""; $("#foodlink").href = pr.url; }
  } catch (e) {}
  try { isAdmin = (await (await fetch("/api/admin")).json()).admin; } catch (e) {}
  try { prefs = await (await fetch("/api/prefs")).json(); } catch (e) {}
  const want = new URLSearchParams(location.search).get("tab");
  setTab(want || "home");
  if (!name && location.hostname !== "127.0.0.1") askName();
})();
</script>
